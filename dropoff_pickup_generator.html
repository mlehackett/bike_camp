<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saddle Up Bike Camp 2026 — Drop-off / Pick-up Forms</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   SCREEN UI
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f0f0; color: #1a1a1a; }
.ui { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.sub { font-size: 14px; color: #666; margin-bottom: 2rem; }
.card { background: white; border: 1px solid #ddd; border-radius: 10px;
  padding: 1.5rem; margin-bottom: 1.25rem; }
.card h3 { font-size: 11px; font-weight: 600; color: #888; margin-bottom: 14px;
  letter-spacing: .06em; text-transform: uppercase; }
.drop-zone { border: 2px dashed #ccc; border-radius: 8px; padding: 2.5rem;
  text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
.drop-zone:hover, .drop-zone.over { border-color: #1a1a2e; background: #f0f4ff; }
.drop-zone p { font-size: 15px; color: #555; margin-top: 5px; }
.drop-zone strong { color: #1a1a1a; }
.map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.map-row { display: flex; flex-direction: column; gap: 5px; }
.map-row label { font-size: 13px; color: #555; }
select { width: 100%; padding: 7px 9px; border: 1px solid #ccc;
  border-radius: 6px; font-size: 13px; background: white; }
.actions { display: flex; gap: 12px; align-items: center; margin-bottom: 1.5rem; }
.btn { padding: 9px 22px; border: 1px solid #ccc; border-radius: 8px;
  font-size: 14px; font-weight: 500; cursor: pointer; background: white; }
.btn:hover { background: #f0f0f0; }
.btn-primary { background: #1a1a2e; color: white; border-color: transparent; }
.btn-primary:hover { background: #2a2a4e; }
.btn-print { background: #2d6a4f; color: white; border-color: transparent; }
.btn-print:hover { background: #245a41; }
.btn-sm { font-size: 12px; padding: 5px 12px; }
.file-status { font-size: 13px; color: #666; margin-top: 10px; min-height: 18px; }
.preview-info { font-size: 13px; color: #666; margin-bottom: 12px; }
.session-check { display:flex; align-items:center; gap:7px; font-size:13px; color:#333; cursor:pointer; }
.session-check input { width:15px; height:15px; cursor:pointer; accent-color:#1a1a2e; }
.session-swatch { width:12px; height:12px; border-radius:2px; flex-shrink:0; }
.defaults-row { display:flex; gap:8px; align-items:center; margin-top:14px; flex-wrap:wrap; }
.defaults-row input[type=text] { flex:1; min-width:180px; font-size:12px; font-family:monospace;
  padding:5px 8px; border:1px solid #ccc; border-radius:6px; }
.copy-msg { font-size:12px; color:#2d6a4f; display:none; }

/* ============================================================
   PRINT PAGES — landscape
   ============================================================ */
.form-page {
  background: white;
  width: 11in;
  min-height: 8.5in;
  padding: 0.4in 0.4in 0.3in;
  margin-bottom: 20px;
  border: 1px solid #ddd;
  border-radius: 4px;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.page-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-bottom: 2px solid #1a1a2e;
  padding-bottom: 8px;
  margin-bottom: 0.25in;
}
.page-title { font-size: 18pt; font-weight: 700; color: #1a1a2e; font-family: Arial, sans-serif; }
.page-day { font-size: 14pt; font-weight: 600; color: #457b9d; font-family: Arial, sans-serif; }
.page-sub { font-size: 9pt; color: #888; font-family: Arial, sans-serif; margin-top: 2px; }
.sig-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-family: Arial, sans-serif;
}
.sig-table th {
  background: #1a1a2e !important;
  color: white !important;
  padding: 8px 12px;
  text-align: left;
  font-size: 10pt;
  font-weight: 600;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.sig-table td {
  border: 1px solid #aaa;
  padding: 0;
}
.sig-table td.name-cell { padding: 8px 12px; font-size: 10pt; }
.sig-table td.sig-cell { height: 38px; }
.sig-table tr.even td { background: #f4f6f8; }
.page-label { font-size: 12px; color: #999; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="ui">
<div class="no-print">
<h1>Saddle Up Bike Camp 2026 — Drop-off / Pick-up Forms</h1>
<p class="sub">Daily sign-in sheets (Mon–Fri) &middot; camper info sheet &middot; landscape</p>

<!-- Step 1: upload -->
<div class="card">
<h3>Step 1 &mdash; Upload spreadsheet</h3>
<div class="drop-zone" id="dz-sheet">
<p><strong>Click to upload</strong> or drag and drop</p>
<p style="font-size:13px;color:#999;margin-top:6px;">CSV or Excel (.xlsx, .xls)</p>
</div>
<input type="file" id="fi-sheet" accept=".csv,.xlsx,.xls" style="display:none">
<div class="file-status" id="sheet-status"></div>
</div>

<!-- Step 2: column mapping -->
<div class="card" id="card-map" style="display:none">
<h3>Step 2 &mdash; Map your columns</h3>
<div class="map-grid" id="map-grid"></div>
<!-- <div class="defaults-row">
<button class="btn btn-sm" id="btn-copy-defaults">Copy defaults JSON</button>
<input type="text" id="paste-defaults" placeholder="Paste saved defaults JSON here&hellip;">
<button class="btn btn-sm" id="btn-apply-defaults">Apply</button>
<span class="copy-msg" id="copy-msg">Copied!</span>
</div> -->
</div>

<!-- Step 3: session filter -->
<div class="card" id="card-filter" style="display:none">
<h3>Step 3 &mdash; Select sessions to print</h3>
<div id="session-checkboxes" style="display:flex;flex-wrap:wrap;gap:10px 24px;margin-bottom:12px;"></div>
<div style="display:flex;gap:10px;">
<button class="btn btn-sm" id="btn-check-all">Select all</button>
<button class="btn btn-sm" id="btn-uncheck-all">Clear all</button>
</div>
</div>

<!-- Actions -->
<div class="actions" id="card-actions" style="display:none">
<button class="btn btn-primary" id="btn-generate">Generate forms</button>
<button class="btn btn-print" id="btn-print" style="display:none">&#x1F5A8;&nbsp; Print / Save PDF</button>
</div>
</div>

<div id="preview-section" style="display:none">
<p class="preview-info" id="preview-info"></p>
<div id="pages"></div>
</div>
</div>

<script>
(function(){

var SESSION_COLORS = {
  "Aug 10-14 Hillsboro Tyson Rec Center": "#2d6a4f",
  "Aug 17-21 Hillsboro UCC": "#1d3557",
  "Aug 3-7 Hillsboro UCC": "#7b3f9e",
  "July 13-17 Hillsboro UCC": "#c1440e",
  "July 20-24 Tigard Fanno Creek House": "#0077b6",
  "July 6-10 Hillsboro UCC": "#a0522d",
  "June 22-26 Forest Grove": "#3a7d44",
  "June 29 - July 3 Forest Grove": "#7b2d8b"
};

var FIELDS = [
  { key:'first', label:"Child's first name", hints:['first','fname','child'], req:true },
  { key:'last', label:"Child's last name", hints:['last','lname','surname'], req:true },
  { key:'session', label:'Session / week', hints:['session','week','group','camp'], req:false },
  { key:'tshirt', label:'T-shirt size', hints:['shirt','tshirt','tee','size'], req:false },
  { key:'bike', label:'Bike status', hints:['bike','status','borrow','own','bring'], req:false },
];

var HARDCODED_DEFAULTS = { "first":"8","last":"9","session":"15","tshirt":"12","bike":"13" };

var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

/* Printed page geometry (letter landscape). Uses the PRINT padding values
   (see @media print override below), since that's what actually governs
   how much vertical room a page has when it comes out of the printer. */
var PAGE_H_IN = 8.5;
var PAGE_MARGIN_IN = 0.4;        /* the @page { margin: 0.4in } reserved on every side */
var PRINT_PAD_TOP_IN = 0.3;      /* .form-page's own top padding, inside that margin */
var PRINT_PAD_BOTTOM_IN = 0.25;  /* .form-page's own bottom padding, inside that margin */
var PX_PER_IN = 96; /* fixed by the CSS spec, same on screen and in print */

var headers=[], rows=[];

/* ── file input ── */
var dz=document.getElementById('dz-sheet');
var fi=document.getElementById('fi-sheet');
on(dz,'click',function(){ fi.click(); });
on(dz,'dragover',function(e){ e.preventDefault(); dz.classList.add('over'); });
on(dz,'dragleave',function(){ dz.classList.remove('over'); });
on(dz,'drop',function(e){ e.preventDefault(); dz.classList.remove('over'); loadSheet(e.dataTransfer.files[0]); });
on(fi,'change',function(e){ if(e.target.files[0]) loadSheet(e.target.files[0]); });
on(document.getElementById('btn-generate'),'click',generate);
on(document.getElementById('btn-print'),'click',function(){ window.print(); });

function on(el,ev,fn){ el.addEventListener(ev,fn); }

function loadSheet(file){
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
      if(!data||data.length<2){ setSt('File appears empty.'); return; }
      headers=data[0].map(function(h){ return String(h); });
      rows=data.slice(1).filter(function(r){ return r.some(function(c){ return c!==''; }); });
      setSt('Loaded '+rows.length+' records from "'+file.name+'"');
      buildMap();
    }catch(err){ setSt('Could not read file: '+err.message); }
  };
  r.readAsArrayBuffer(file);
}

function setSt(m){ document.getElementById('sheet-status').textContent=m; }

function colLetter(i){
  var s=''; i++;
  while(i>0){ i--; s=String.fromCharCode(65+(i%26))+s; i=Math.floor(i/26); }
  return s;
}

function detect(hints){
  return headers.findIndex(function(h){
    var hl=h.toLowerCase().replace(/[\s_\-]/g,'');
    return hints.some(function(hint){ return hl.indexOf(hint)!==-1; });
  });
}

function buildMap(overrides){
  document.getElementById('card-map').style.display='';
  document.getElementById('card-actions').style.display='flex';
  var grid=document.getElementById('map-grid'); grid.innerHTML='';
  var opts='<option value="-1">-- skip --</option>'+
    headers.map(function(h,i){ return '<option value="'+i+'">'+colLetter(i)+' – '+esc(h)+'</option>'; }).join('');
  var saved=overrides||HARDCODED_DEFAULTS||{};
  FIELDS.forEach(function(f){
    var d=document.createElement('div'); d.className='map-row';
    d.innerHTML='<label>'+f.label+(f.req?' *':'')+'</label><select id="col-'+f.key+'">'+opts+'</select>';
    grid.appendChild(d);
    var sel=document.getElementById('col-'+f.key);
    if(saved[f.key]!==undefined){
      var si=parseInt(saved[f.key],10);
      if(si>=0&&si<headers.length){ sel.value=String(si); }
    } else {
      var a=detect(f.hints); if(a>=0) sel.value=String(a);
    }
  });
  buildSessionFilter();
  var sessSel=document.getElementById('col-session');
  if(sessSel) on(sessSel,'change',buildSessionFilter);
}

/* ── defaults copy/paste ── */
on(document.getElementById('btn-copy-defaults'),'click',function(){
  var obj={};
  FIELDS.forEach(function(f){
    var s=document.getElementById('col-'+f.key);
    if(s) obj[f.key]=s.value;
  });
  var json=JSON.stringify(obj);
  navigator.clipboard.writeText(json).then(function(){
    var msg=document.getElementById('copy-msg');
    msg.style.display='inline';
    setTimeout(function(){ msg.style.display='none'; },2000);
  });
});
on(document.getElementById('btn-apply-defaults'),'click',function(){
  var raw=document.getElementById('paste-defaults').value.trim();
  if(!raw){ return; }
  try{
    var obj=JSON.parse(raw);
    buildMap(obj);
  }catch(e){ alert('Invalid JSON — please paste the copied defaults string.'); }
});

function getval(row,key){
  var s=document.getElementById('col-'+key);
  if(!s) return '';
  var i=parseInt(s.value,10);
  if(isNaN(i)||i<0) return '';
  var v=row[i];
  if(v===null||v===undefined) return '';
  return String(v).trim();
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── session filter ── */
function buildSessionFilter(){
  var colSel=document.getElementById('col-session');
  var colIdx=colSel?parseInt(colSel.value,10):-1;
  var seen=[];
  rows.forEach(function(row){
    var s=colIdx>=0&&row[colIdx]!==undefined&&row[colIdx]!==''?String(row[colIdx]).trim():'(no session)';
    if(seen.indexOf(s)<0) seen.push(s);
  });
  seen.sort();
  var wrap=document.getElementById('session-checkboxes'); wrap.innerHTML='';
  seen.forEach(function(s){
    var color=SESSION_COLORS[s]||'#444';
    var lbl=document.createElement('label'); lbl.className='session-check';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.value=s;
    var sw=document.createElement('div'); sw.className='session-swatch'; sw.style.background=color;
    var txt=document.createTextNode(s);
    lbl.appendChild(cb); lbl.appendChild(sw); lbl.appendChild(txt);
    wrap.appendChild(lbl);
  });
  document.getElementById('card-filter').style.display='';
  on(document.getElementById('btn-check-all'), 'click',function(){ wrap.querySelectorAll('input').forEach(function(cb){ cb.checked=true; }); });
  on(document.getElementById('btn-uncheck-all'),'click',function(){ wrap.querySelectorAll('input').forEach(function(cb){ cb.checked=false; }); });
}

function getSelectedSessions(){
  var sel=[];
  document.getElementById('session-checkboxes').querySelectorAll('input:checked').forEach(function(cb){ sel.push(cb.value); });
  return sel;
}

/* ── pagination helpers ──
   Renders a throwaway copy of a page's header + table (with two sample
   rows) off-screen, measures the actual rendered heights, and works out
   how many camper rows will fit on one printed page before the header
   needs to repeat. */
function measureRowsPerPage(headerHTML, theadInner, sampleRowHTML){
  var probe=document.createElement('div');
  probe.className='form-page';
  probe.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden;';
  probe.innerHTML=headerHTML+
    '<table class="sig-table"><thead>'+theadInner+'</thead><tbody>'+
    sampleRowHTML+sampleRowHTML+'</tbody></table>';
  document.body.appendChild(probe);

  var headerEl=probe.querySelector('.page-header');
  var theadEl=probe.querySelector('thead');
  var trs=probe.querySelectorAll('tbody tr');

  var headerH=headerEl.getBoundingClientRect().height+parseFloat(getComputedStyle(headerEl).marginBottom||'0');
  var theadH=theadEl.getBoundingClientRect().height;
  var rowH=trs[1].getBoundingClientRect().height; /* 2nd row avoids any first-row border rounding */

  document.body.removeChild(probe);

  var contentH=(PAGE_H_IN-(2*PAGE_MARGIN_IN)-PRINT_PAD_TOP_IN-PRINT_PAD_BOTTOM_IN)*PX_PER_IN;
  var available=contentH-headerH-theadH-4; /* small buffer for border rounding */
  return Math.max(1, Math.floor(available/rowH));
}

function chunk(arr,size){
  var out=[];
  for(var i=0;i<arr.length;i+=size){ out.push(arr.slice(i,i+size)); }
  return out;
}

/* ── generate ── */
function generate(){
  if(!rows.length){ alert('Please upload a spreadsheet first.'); return; }
  var selectedSessions=getSelectedSessions();
  if(!selectedSessions.length){ alert('Please select at least one session.'); return; }

  var filtered=rows.filter(function(row){
    var s=getval(row,'session')||'(no session)';
    return selectedSessions.indexOf(s)>=0;
  }).sort(function(a,b){
    var la=getval(a,'last').toLowerCase(), lb=getval(b,'last').toLowerCase();
    if(la<lb) return -1; if(la>lb) return 1;
    var fa=getval(a,'first').toLowerCase(), fb=getval(b,'first').toLowerCase();
    return fa<fb?-1:fa>fb?1:0;
  });

  if(!filtered.length){ alert('No campers found for the selected sessions.'); return; }

  var sessionLabel=selectedSessions.join(' · ');
  var pages=document.getElementById('pages'); pages.innerHTML='';
  var pageNum=0;

  /* measure how many rows fit per page, once, using sample markup */
  var dailyHeaderHTML=
    '<div class="page-header">'+
      '<div>'+
        '<div class="page-title">Drop-off / Pick-up</div>'+
        '<div class="page-sub">'+esc(sessionLabel)+'</div>'+
      '</div>'+
      '<div class="page-day">Monday</div>'+
    '</div>';
  var dailyTheadInner=
    '<tr>'+
      '<th style="width:34%">Camper Name</th>'+
      '<th style="width:33%">Drop-off Signature</th>'+
      '<th style="width:33%">Pick-up Signature</th>'+
    '</tr>';
  var dailySampleRow='<tr><td class="name-cell">Sample, Name</td><td class="sig-cell"></td><td class="sig-cell"></td></tr>';
  var rowsPerDailyPage=measureRowsPerPage(dailyHeaderHTML, dailyTheadInner, dailySampleRow);

  var infoHeaderHTML=
    '<div class="page-header">'+
      '<div>'+
        '<div class="page-title">Camper Info</div>'+
        '<div class="page-sub">'+esc(sessionLabel)+'</div>'+
      '</div>'+
    '</div>';
  var infoTheadInner=
    '<tr>'+
      '<th style="width:28%">Camper Name</th>'+
      '<th style="width:14%">T-shirt Size</th>'+
      '<th style="width:28%">Bike Status</th>'+
      '<th style="width:30%">Comments</th>'+
    '</tr>';
  var infoSampleRow='<tr><td class="name-cell">Sample, Name</td><td class="name-cell">M</td><td class="name-cell">Own</td><td class="sig-cell"></td></tr>';
  var rowsPerInfoPage=measureRowsPerPage(infoHeaderHTML, infoTheadInner, infoSampleRow);

  /* ── daily sign-in pages, split + header repeated whenever a day overflows ── */
  DAYS.forEach(function(day){
    var dayChunks=chunk(filtered, rowsPerDailyPage);
    dayChunks.forEach(function(rowsChunk, ci){
      pageNum++;
      var cont=ci>0?" (cont'd)":"";
      var pg=document.createElement('div'); pg.className='form-page';
      var lbl=document.createElement('div'); lbl.className='page-label no-print';
      lbl.textContent='Page '+pageNum+' — '+day+cont;
      pg.appendChild(lbl);
      pg.innerHTML+=
        '<div class="page-header">'+
          '<div>'+
            '<div class="page-title">Drop-off / Pick-up</div>'+
            '<div class="page-sub">'+esc(sessionLabel)+'</div>'+
          '</div>'+
          '<div class="page-day">'+day+cont+'</div>'+
        '</div>';
      var tbl=document.createElement('table'); tbl.className='sig-table';
      tbl.innerHTML=
        '<thead><tr>'+
          '<th style="width:34%">Camper Name</th>'+
          '<th style="width:33%">Drop-off Signature</th>'+
          '<th style="width:33%">Pick-up Signature</th>'+
        '</tr></thead>';
      var tbody=document.createElement('tbody');
      rowsChunk.forEach(function(row,i){
        var name=esc(getval(row,'last'))+', '+esc(getval(row,'first'));
        var tr=document.createElement('tr'); if(i%2===1) tr.className='even';
        tr.innerHTML=
          '<td class="name-cell">'+name+'</td>'+
          '<td class="sig-cell"></td>'+
          '<td class="sig-cell"></td>';
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      pg.appendChild(tbl);
      pages.appendChild(pg);
    });
  });

  /* ── camper info page(s), split the same way ── */
  var infoChunks=chunk(filtered, rowsPerInfoPage);
  infoChunks.forEach(function(rowsChunk, ci){
    pageNum++;
    var cont=ci>0?" (cont'd)":"";
    var infoPg=document.createElement('div'); infoPg.className='form-page';
    var infoLbl=document.createElement('div'); infoLbl.className='page-label no-print';
    infoLbl.textContent='Page '+pageNum+' — Camper Info'+cont;
    infoPg.appendChild(infoLbl);
    infoPg.innerHTML+=
      '<div class="page-header">'+
        '<div>'+
          '<div class="page-title">Camper Info'+cont+'</div>'+
          '<div class="page-sub">'+esc(sessionLabel)+'</div>'+
        '</div>'+
      '</div>';
    var infoTbl=document.createElement('table'); infoTbl.className='sig-table';
    infoTbl.innerHTML=
      '<thead><tr>'+
        '<th style="width:28%">Camper Name</th>'+
        '<th style="width:14%">T-shirt Size</th>'+
        '<th style="width:28%">Bike Status</th>'+
        '<th style="width:30%">Comments</th>'+
      '</tr></thead>';
    var infoTbody=document.createElement('tbody');
    rowsChunk.forEach(function(row,i){
      var name=esc(getval(row,'last'))+', '+esc(getval(row,'first'));
      var tr=document.createElement('tr'); if(i%2===1) tr.className='even';
      tr.innerHTML=
        '<td class="name-cell">'+name+'</td>'+
        '<td class="name-cell">'+esc(getval(row,'tshirt'))+'</td>'+
        '<td class="name-cell">'+esc(getval(row,'bike'))+'</td>'+
        '<td class="sig-cell"></td>';
      infoTbody.appendChild(tr);
    });
    infoTbl.appendChild(infoTbody);
    infoPg.appendChild(infoTbl);
    pages.appendChild(infoPg);
  });

  var total=filtered.length;
  document.getElementById('preview-info').textContent=
    total+' camper'+(total!==1?'s':'')+' — '+pageNum+' page'+(pageNum!==1?'s':'')+' total.';
  document.getElementById('preview-section').style.display='';
  document.getElementById('btn-print').style.display='';
}

}());
</script>

<style>
@media print {
  @page { size: letter landscape; margin: 0.4in; }
  body { background: white; }
  .no-print { display: none !important; }
  .preview-info { display: none !important; }
  .ui { padding: 0; max-width: 100%; margin: 0; }
  .form-page {
    border: none; border-radius: 0;
    margin: 0;
    padding: 0.3in 0.35in 0.25in;
    page-break-after: always;
    width: auto;
    min-height: auto;
  }
  .form-page:last-child { page-break-after: avoid; }
  .page-label { display: none !important; }
}
</style>
</body>
</html>
